name: RBLN log privacy regression
on:
  pull_request:
    branches: [rbln]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test tools, without installing Cal
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
        run: >-
          npm install --prefix "$RUNNER_TEMP/log-tests" --no-audit --no-fund
          jest@29.7.0 ts-jest@29.1.4 typescript@5.9.3
          @nestjs/common@10.4.20 @nestjs/core@10.4.20
          reflect-metadata@0.1.14 rxjs@7.8.2 node-mocks-http@1.16.2
          zod@3.25.76 @prisma/client@6.16.1 @trpc/server@11.0.0-next-beta.222
          @nestjs/testing@10.4.20 @nestjs/axios@4.0.0 @nestjs/config@3.2.0
          @nestjs/swagger@7.4.2 class-transformer@0.5.1 luxon@3.4.4 axios@1.8.4
      - name: Capture logger and prove regression against the anchor
        env:
          TEST_DEPS: ${{ runner.temp }}/log-tests
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          deps=os.environ['TEST_DEPS']+'/node_modules'
          config={'rootDir':os.environ['GITHUB_WORKSPACE']+'/apps/api/v2',
            'testEnvironment':'node','moduleDirectories':[deps,'node_modules'],
            'moduleNameMapper':{'^@/(.*)$':'<rootDir>/src/$1'},
            'transform':{r'^.+\.ts$':[deps+'/ts-jest',{'isolatedModules':True,'diagnostics':False,
              'tsconfig':{'target':'ES2021','module':'commonjs','esModuleInterop':True,
                'experimentalDecorators':True,'emitDecoratorMetadata':True}}]}}
          (temp/'log-jest.json').write_text(json.dumps(config))
          PY
          test_logs() {
            node "$TEST_DEPS/node_modules/jest/bin/jest.js" --config "$RUNNER_TEMP/log-jest.json" \
              --runInBand src/lib/filterReqHeaders.spec.ts src/filters/http-exception.filter.spec.ts \
              src/filters/error-log-privacy.spec.ts src/lib/safe-parse/safe-parse.spec.ts \
              src/modules/oauth-clients/services/oauth-log-privacy.spec.ts src/modules/redis/redis.service.spec.ts "$@"
          }
          test_logs
          for file in src/lib/filterReqHeaders.ts src/lib/safe-parse/safe-parse.ts \
            src/filters/{http,prisma,trpc,zod,calendar-service}-exception.filter.ts \
            src/modules/auth/oauth2/filters/oauth2-http-exception.filter.ts \
            src/modules/conferencing/controllers/conferencing.controller.ts \
            src/modules/stripe/controllers/stripe.controller.ts \
            src/modules/oauth-clients/services/oauth-flow.service.ts src/modules/redis/redis.service.ts; do
            git show "54343aa685ae8f33159d2f485ec4a57bad5c574a:apps/api/v2/$file" > "apps/api/v2/$file"
          done
          if test_logs --json --outputFile="$RUNNER_TEMP/anchor-results.json"; then
            echo 'Regression tests incorrectly accepted the unpatched anchor'; exit 1
          fi
          python3 - <<'PY'
          import json,os,pathlib
          result=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'anchor-results.json').read_text())
          cases=[case for suite in result['testResults'] for case in suite['assertionResults']]
          for point in ('header','body','query'):
            assert any(case['status']=='failed' and 'keeps '+point+' credentials' in case['fullName'] for case in cases), point
          for name in ('Prisma', 'TRPC', 'Zod', 'CalendarService', 'OAuth2'):
            assert any(case['status']=='failed' and name+' filter keeps all markers' in case['fullName'] for case in cases), name
          for point in ('input and issue', 'conferencing callback', 'stripe callback', 'Redis command', 'AUTH password'):
            assert any(case['status']=='failed' and 'keeps '+point in case['fullName'] for case in cases), point
          responses=[case for case in cases if 'preserves anchor HTTP response' in case['fullName']]
          assert len(responses)==18 and all(case['status']=='passed' for case in responses)
          PY
          node --test scripts/rbln/check-log-policy.test.cjs
          python3 deploy/test-sync-vars.py
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed source and tests with the pinned API dependencies
        env:
          API_IMAGE: ghcr.io/juanmateixido/rbln-cal-api@sha256:5f7805737f9e2d61cfb7e58086c540b6afad5fcc05273fcd1ca41fd8f0f5591c
        run: |
          set -euo pipefail
          git diff --name-only origin/rbln...HEAD -- apps/api/v2/src > "$RUNNER_TEMP/type-files"
          mounts=()
          while IFS= read -r file; do
            mounts+=(-v "$GITHUB_WORKSPACE/$file:/calcom/$file:ro")
          done < "$RUNNER_TEMP/type-files"
          python3 - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          config={'extends':'/calcom/apps/api/v2/tsconfig.json',
            'compilerOptions':{'noEmit':True,'incremental':True,'tsBuildInfoFile':'/tmp/privacy.tsbuildinfo'},
            'include':['/calcom/packages/types/*.d.ts']+['/calcom/'+p for p in (temp/'type-files').read_text().splitlines()],
            'exclude':['node_modules','dist']}
          (temp/'privacy-tsconfig.json').write_text(json.dumps(config))
          PY
          docker pull "$API_IMAGE"
          docker run --rm -e NODE_OPTIONS=--max-old-space-size=6144 "${mounts[@]}" \
            -v "$RUNNER_TEMP/privacy-tsconfig.json:/calcom/apps/api/v2/tsconfig.privacy.json:ro" \
            "$API_IMAGE" yarn exec tsc -p apps/api/v2/tsconfig.privacy.json --incremental

name: RBLN images
on:
  push:
    branches: [rbln]
    paths: ['Dockerfile', '.dockerignore', 'apps/**', 'packages/**', 'deploy/build-*', 'deploy/check-public-image.py', 'scripts/start.sh', 'scripts/seed-app-store.ts', 'package.json', 'yarn.lock', '.yarn/**', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: rbln-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: Dockerfile
            port: 3000
            health: /auth/login
          - app: api
            dockerfile: apps/api/v2/Dockerfile
            port: 5555
            health: /health
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: calendso
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      IMAGE: ghcr.io/juanmateixido/rbln-cal-${{ matrix.app }}
      TAG: sha-${{ github.sha }}
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/calendso
    steps:
      - uses: actions/checkout@v4
      - name: Reject private build inputs
        run: |
          python3 deploy/test-public-image.py
          python3 deploy/check-public-image.py
      - name: Make room on the disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          network: host
          allow: network.host
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/juanmateixido/rbln-cal
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://agenda.rebelion.training
            NEXT_PUBLIC_APP_NAME=RBLN Agenda
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=10240
          secret-files: |
            rbln_build_fixtures=deploy/build-fixtures.sh
      - name: Reject private names in image metadata and layers
        run: python3 deploy/check-public-image.py --image "$IMAGE:$TAG"
      - name: Test request header redaction in the API image
        if: matrix.app == 'api' && hashFiles('apps/api/v2/src/lib/filterReqHeaders.spec.ts') != ''
        run: docker run --rm "$IMAGE:$TAG" yarn workspace @calcom/api-v2 exec jest src/lib/filterReqHeaders.spec.ts --runInBand
      - name: Smoke test migrations and HTTP startup
        env:
          APP: ${{ matrix.app }}
          HEALTH: ${{ matrix.health }}
          HTTP_PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          docker run --rm --network host -e DATABASE_URL -e DATABASE_DIRECT_URL="$DATABASE_URL" \
            "$IMAGE:$TAG" yarn prisma migrate deploy
          docker run -d --name smoke --network host \
            -e DATABASE_URL -e DATABASE_DIRECT_URL="$DATABASE_URL" \
            -e DATABASE_READ_URL="$DATABASE_URL" -e DATABASE_WRITE_URL="$DATABASE_URL" \
            -e DATABASE_HOST=127.0.0.1:5432 -e REDIS_URL=redis://127.0.0.1:6379 \
            -e NEXTAUTH_SECRET=ci-only-no-production-access \
            -e CALENDSO_ENCRYPTION_KEY=00000000000000000000000000000000 \
            -e JWT_SECRET=ci-only-no-production-access \
            -e STRIPE_API_KEY=sk_test_unused -e STRIPE_WEBHOOK_SECRET=whsec_unused \
            -e API_PORT=5555 -e API_URL=http://127.0.0.1:5555 \
            -e NEXTAUTH_URL=http://127.0.0.1:3000 -e NEXT_PUBLIC_WEBAPP_URL=http://127.0.0.1:3000 \
            -e CALCOM_TELEMETRY_DISABLED=1 -e ENABLE_ASYNC_TASKER=0 \
            "$IMAGE:$TAG"
          for attempt in $(seq 1 90); do
            status=$(curl -s -L --max-redirs 3 --max-time 10 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$HTTP_PORT$HEALTH" || true)
            if [ "$status" = 200 ]; then exit 0; fi
            sleep 5
          done
          docker logs --tail 100 smoke
          exit 1
      - name: Publish immutable image
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing SHA tag'
            exit 1
          fi
          docker push "$IMAGE:$TAG"
          docker pull "$IMAGE:$TAG"
          docker image inspect "$IMAGE:$TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Stop smoke container
        if: always()
        run: docker rm -f smoke || true
